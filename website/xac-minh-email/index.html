<!doctype html>
<html lang="vi" data-api-mode="auto">
<head>

  <meta charset="utf-8">

    <div class="container" style="max-width:760px">

        <div data-email-confirm-actions hidden style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
          <a class="button button-primary" href="signup/">Quay lại đăng ký</a>
          <a class="button button-secondary" href="dang-nhap/">Đăng nhập</a>
