name: Verify private workspace evidence reader
on:
  push:
    branches: ['feat/workspace-evidence-reader-20260907']
    paths:
      - 'scripts/finish_workspace_reader.py'
      - 'engine/tests/workspace_reader.test.mjs'
      - '.github/workflows/workspace-evidence-reader.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pandas==3.0.5 requests==2.34.2 pytest==9.1.1
      - run: python scripts/finish_workspace_reader.py
      - name: Verify no-inference and private session contracts
        run: |
          node --check website/assets/chatgpt-workspace.js
          node --test engine/tests/*.test.mjs
          node --test scripts/project_context_read_test.mjs scripts/private_project_bridge_test.mjs scripts/project_knowledge_bridge_test.mjs
          python -m unittest discover -s engine/tests
          python -m pytest engine/tests -q
          git diff --check
      - name: Commit verified reader to feature branch only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'StockRadar workspace verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/assets/chatgpt-workspace.js
          if ! git diff --cached --quiet; then
            git commit -m 'Show report evidence and data timestamps without cross-session leakage'
            git push origin "HEAD:$BRANCH_NAME"
          fi
