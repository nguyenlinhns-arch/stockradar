name: Validate runtime header dedupe

on:
  push:
    branches: [fix-runtime-register-duplicate]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check header dedupe JavaScript
        run: node --check website/assets/header-auth-dedupe-v6.js
      - name: Build fail-closed public data
        run: python -m engine.cli build-public
      - name: Run regression suite
        run: python -m unittest discover -s engine/tests -v
      - name: Build and verify production Pages artifact
        env:
          STOCKRADAR_ENABLE_AUTH: "1"
          STOCKRADAR_AUTH_EMAIL_READY: "0"
          STOCKRADAR_SUPABASE_URL: "https://xamviatbxufjlpiwhebb.supabase.co"
          STOCKRADAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Ne0TfBw0Iu732yrhqRcdIA_hPGxYDAK"
        run: |
          python scripts/build_pages.py --output .pages-site
          python scripts/inject_public_ux.py .pages-site
          python scripts/verify_pages_auth.py .pages-site
          python scripts/verify_pages_public_surface.py .pages-site
          grep -q 'header-auth-dedupe-v6.js?v=20260903-site6' .pages-site/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('.pages-site/index.html').read_text(encoding='utf-8')
          nav = re.search(r'<nav\b[^>]*data-nav-menu[^>]*>(.*?)</nav>', source, flags=re.I|re.S)
          assert nav
          assert 'dang-ky/' not in nav.group(1).lower()
          assert 'dang-nhap/' not in nav.group(1).lower()
          assert source.count('data-header-auth-actions') == 1
          PY
