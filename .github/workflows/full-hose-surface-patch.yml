name: Apply Full-HOSE Surface Patch

on:
  push:
    branches:
      - fix/full-hose-alphanumeric-surface-20260904
    paths:
      - 'scripts/apply_full_hose_surface_patch.py'
      - '.github/workflows/full-hose-surface-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[surface-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-hose-alphanumeric-surface-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/apply_full_hose_surface_patch.py
      - name: Run backend regression suite
        run: python -m unittest discover -s engine/tests -p 'test_*.py'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            website/assets/app.js \
            website/assets/account-preferences.js \
            website/assets/home-core-v1.js \
            website/assets/stock-api-client.js \
            website/assets/buyer-readiness-v1.js \
            website/assets/public-copy-v7.js \
            website/assets/free-stock-context-v1.js \
            website/assets/direct-ticker-nav-v1.js \
            website/assets/stock-page-context-v1.js; do
            node --check "$file"
          done
      - name: Remove one-shot migration files and commit results
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_full_hose_surface_patch.py .github/workflows/full-hose-surface-patch.yml
          git config user.name 'stockradar-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Apply full-HOSE alphanumeric surface compatibility [surface-patched]'
          git push origin HEAD:fix/full-hose-alphanumeric-surface-20260904
