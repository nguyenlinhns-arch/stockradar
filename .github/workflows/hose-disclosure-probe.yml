name: Probe HOSE official disclosures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_hose_disclosures.py'
      - '.github/workflows/hose-disclosure-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: pip install --disable-pip-version-check requests
      - name: Probe HOSE official disclosure page and sample announcement
        run: python scripts/probe_hose_disclosures.py

# Triggered after workflow installation so the push path is active.
