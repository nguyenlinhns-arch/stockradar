name: Apply Radar Review 30 V8

on:
  push:
    branches: [radar-review-30-v8-production]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Add one-shot Radar 30 migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: radar-review-30-v8-production
      - name: Apply 30-stock balanced Radar scope
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json
          import re

          ROOT = Path('.')
          LABEL = 'Danh sách cổ phiếu theo Radar rà soát'
          ITEMS = [
              {"ticker":"ACB","company_name":"Ngân hàng TMCP Á Châu","sector":"Ngân hàng","exchange":"HOSE","active":True},
              {"ticker":"MBB","company_name":"Ngân hàng TMCP Quân Đội","sector":"Ngân hàng","exchange":"HOSE","active":True},
              {"ticker":"TCB","company_name":"Ngân hàng TMCP Kỹ Thương Việt Nam","sector":"Ngân hàng","exchange":"HOSE","active":True},
              {"ticker":"HCM","company_name":"Công ty Cổ phần Chứng khoán TP.HCM","sector":"Chứng khoán","exchange":"HOSE","active":True},
              {"ticker":"SSI","company_name":"Công ty Cổ phần Chứng khoán SSI","sector":"Chứng khoán","exchange":"HOSE","active":True},
              {"ticker":"VCI","company_name":"Công ty Cổ phần Chứng khoán Vietcap","sector":"Chứng khoán","exchange":"HOSE","active":True},
              {"ticker":"HPG","company_name":"Công ty Cổ phần Tập đoàn Hòa Phát","sector":"Thép","exchange":"HOSE","active":True},
              {"ticker":"HSG","company_name":"Công ty Cổ phần Tập đoàn Hoa Sen","sector":"Thép","exchange":"HOSE","active":True},
              {"ticker":"NKG","company_name":"Công ty Cổ phần Thép Nam Kim","sector":"Thép","exchange":"HOSE","active":True},
              {"ticker":"FPT","company_name":"Công ty Cổ phần FPT","sector":"Công nghệ","exchange":"HOSE","active":True},
              {"ticker":"CMG","company_name":"Công ty Cổ phần Tập đoàn Công nghệ CMC","sector":"Công nghệ","exchange":"HOSE","active":True},
              {"ticker":"ELC","company_name":"Công ty Cổ phần Công nghệ - Viễn thông ELCOM","sector":"Công nghệ","exchange":"HOSE","active":True},
              {"ticker":"GAS","company_name":"Tổng Công ty Khí Việt Nam","sector":"Dầu khí","exchange":"HOSE","active":True},
              {"ticker":"PLX","company_name":"Tập đoàn Xăng dầu Việt Nam","sector":"Dầu khí","exchange":"HOSE","active":True},
              {"ticker":"PVD","company_name":"Tổng Công ty Cổ phần Khoan và Dịch vụ Khoan Dầu khí","sector":"Dầu khí","exchange":"HOSE","active":True},
              {"ticker":"MWG","company_name":"Công ty Cổ phần Đầu tư Thế Giới Di Động","sector":"Bán lẻ & phân phối","exchange":"HOSE","active":True},
              {"ticker":"FRT","company_name":"Công ty Cổ phần Bán lẻ Kỹ thuật số FPT","sector":"Bán lẻ & phân phối","exchange":"HOSE","active":True},
              {"ticker":"DGW","company_name":"Công ty Cổ phần Thế Giới Số","sector":"Bán lẻ & phân phối","exchange":"HOSE","active":True},
              {"ticker":"VIC","company_name":"Tập đoàn Vingroup","sector":"Bất động sản","exchange":"HOSE","active":True},
              {"ticker":"VHM","company_name":"Công ty Cổ phần Vinhomes","sector":"Bất động sản","exchange":"HOSE","active":True},
              {"ticker":"KDH","company_name":"Công ty Cổ phần Đầu tư và Kinh doanh Nhà Khang Điền","sector":"Bất động sản","exchange":"HOSE","active":True},
              {"ticker":"VNM","company_name":"Công ty Cổ phần Sữa Việt Nam","sector":"Hàng tiêu dùng","exchange":"HOSE","active":True},
              {"ticker":"MSN","company_name":"Công ty Cổ phần Tập đoàn Masan","sector":"Hàng tiêu dùng","exchange":"HOSE","active":True},
              {"ticker":"SAB","company_name":"Tổng Công ty Cổ phần Bia - Rượu - Nước giải khát Sài Gòn","sector":"Hàng tiêu dùng","exchange":"HOSE","active":True},
              {"ticker":"POW","company_name":"Tổng Công ty Điện lực Dầu khí Việt Nam - CTCP","sector":"Điện & tiện ích","exchange":"HOSE","active":True},
              {"ticker":"REE","company_name":"Công ty Cổ phần Cơ Điện Lạnh","sector":"Điện & tiện ích","exchange":"HOSE","active":True},
              {"ticker":"GEG","company_name":"Công ty Cổ phần Điện Gia Lai","sector":"Điện & tiện ích","exchange":"HOSE","active":True},
              {"ticker":"GMD","company_name":"Công ty Cổ phần Gemadept","sector":"Logistics & cảng","exchange":"HOSE","active":True},
              {"ticker":"VSC","company_name":"Công ty Cổ phần Container Việt Nam","sector":"Logistics & cảng","exchange":"HOSE","active":True},
              {"ticker":"HAH","company_name":"Công ty Cổ phần Vận tải và Xếp dỡ Hải An","sector":"Logistics & cảng","exchange":"HOSE","active":True},
          ]
          SECTORS = []
          for item in ITEMS:
              if item['sector'] not in SECTORS:
                  SECTORS.append(item['sector'])
          counts = Counter(item['sector'] for item in ITEMS)
          assert len(ITEMS) == 30
          assert len(SECTORS) == 10
          assert set(counts.values()) == {3}

          def write_json(path, payload):
              Path(path).write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def sub_once(pattern, replacement, text, flags=re.S):
              text, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise RuntimeError(f'Expected one replacement for {pattern!r}, got {n}')
              return text

          # Authoritative fixture used by `build-public`: keep DEMO1 only for isolated engine demo paths.
          fixture_path = ROOT / 'engine/fixtures/hose_universe_demo.json'
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          demo = next((x for x in fixture.get('items', []) if x.get('ticker') == 'DEMO1'), {
              'ticker':'DEMO1','company_name':'Doanh nghiệp mô phỏng số 1','sector':'Nhóm mô phỏng','exchange':'HOSE','active':True
          })
          fixture['selection_label'] = LABEL
          fixture['selection_kind'] = 'RADAR_REVIEW_BALANCED_30'
          fixture['balanced_sector_count'] = 10
          fixture['per_sector'] = 3
          fixture['items'] = ITEMS + [demo]
          write_json(fixture_path, fixture)

          # Keep checked-in public payload aligned before/after build-public.
          public_path = ROOT / 'website/public/data/ticker-universe.json'
          public = json.loads(public_path.read_text(encoding='utf-8'))
          public['selection_label'] = LABEL
          public['selection_kind'] = 'RADAR_REVIEW_BALANCED_30'
          public['balanced_sector_count'] = 10
          public['per_sector'] = 3
          public['items'] = sorted(ITEMS, key=lambda x: x['ticker'])
          write_json(public_path, public)

          # Preserve selection metadata when CI rebuilds fail-closed public payloads.
          cli_path = ROOT / 'engine/cli.py'
          cli = cli_path.read_text(encoding='utf-8')
          anchor = '            "public_scope": "REFERENCE_ONLY",\n            "internal_reference": reference,\n            "items": securities,\n'
          replacement = '            "public_scope": "REFERENCE_ONLY",\n            "selection_label": ticker_payload.get("selection_label", "Danh sách cổ phiếu theo Radar rà soát"),\n            "selection_kind": ticker_payload.get("selection_kind", "RADAR_REVIEW_BALANCED_30"),\n            "balanced_sector_count": ticker_payload.get("balanced_sector_count", 10),\n            "per_sector": ticker_payload.get("per_sector", 3),\n            "internal_reference": reference,\n            "items": securities,\n'
          if anchor not in cli:
              raise RuntimeError('build-public ticker-universe anchor not found')
          cli_path.write_text(cli.replace(anchor, replacement, 1), encoding='utf-8')

          # Homepage: 30 review tickers, exactly 3 per sector.
          index_path = ROOT / 'website/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('<h2>Danh sách cổ phiếu cụ thể</h2>', f'<h2>{LABEL}</h2>', 1)
          summary = f'''<div class="home-recommendation-summary">
            <div><span>Tín hiệu hành động hiện tại</span><strong>0 mã</strong><small>Không có setup đạt chuẩn tại snapshot công khai hiện tại.</small></div>
            <div><span>{LABEL}</span><strong>30 mã</strong><small>10 nhóm ngành · 3 mã mỗi ngành · phạm vi rà soát cân bằng trên HOSE.</small></div>
          </div>'''
          index = sub_once(r'<div class="home-recommendation-summary">.*?<div class="home-watchlist-title">', summary + '\n          <div class="home-watchlist-title">', index)
          cols = []
          for chunk in (ITEMS[:15], ITEMS[15:]):
              rows = '\n'.join(f'              <div class="home-watch-row"><b>{x["ticker"]}</b><span>{x["sector"]}</span><em>RÀ SOÁT</em></div>' for x in chunk)
              cols.append('            <div class="home-watch-col">\n' + rows + '\n            </div>')
          watch_grid = '<div class="home-watchlist-grid">\n' + '\n'.join(cols) + '\n          </div>'
          index = sub_once(r'<div class="home-watchlist-grid">.*?<div class="home-watch-note">', watch_grid + '\n          <div class="home-watch-note">', index)
          index = index.replace('Các nhóm đang được StockRadar theo dõi trên HOSE.', '10 nhóm ngành được Radar rà soát cân bằng trên HOSE.', 1)
          sector_rows = []
          for sector in SECTORS:
              tickers = ', '.join(x['ticker'] for x in ITEMS if x['sector'] == sector)
              sector_rows.append(f'            <div class="home-sector-row"><strong>{sector}</strong><span><b>3 mã</b> · {tickers}</span></div>')
          sector_list = '<div class="home-sector-list">\n' + '\n'.join(sector_rows) + '\n          </div>'
          index = sub_once(r'<div class="home-sector-list">.*?</div>\s*</article>\s*\n\s*<aside class="home-panel home-newsletter-panel"', sector_list + '\n        </article>\n\n        <aside class="home-panel home-newsletter-panel"', index)
          ticker_spans = ''.join(f'<span><b>{x["ticker"]}</b><small>{x["sector"]}</small></span>' for x in ITEMS)
          ticker_section = f'''<section class="home-ticker-strip" aria-label="Danh sách cổ phiếu theo Radar rà soát">
      <div class="container">
        <div class="home-ticker-strip-head"><strong>30 mã theo Radar rà soát · 10 ngành × 3 mã</strong><a href="kiem-tra-co-phieu/">Tra cứu mã khác →</a></div>
        <div class="home-ticker-grid">{ticker_spans}</div>
      </div>
    </section>'''
          index = sub_once(r'<section class="home-ticker-strip".*?</section>', ticker_section, index)
          index_path.write_text(index, encoding='utf-8')

          # Recommendation page: same authoritative 30-review list.
          reco_path = ROOT / 'website/khuyen-nghi/index.html'
          reco = reco_path.read_text(encoding='utf-8')
          reco = reco.replace('Danh sách khuyến nghị StockRadar đã phát hành và danh mục cổ phiếu HOSE tham chiếu đang theo dõi.', 'Tín hiệu hành động StockRadar và danh sách 30 cổ phiếu theo Radar rà soát cân bằng theo ngành.')
          reco = reco.replace('Mã nào đã phát hành sẽ có trạng thái, vùng mua, cắt lỗ, mục tiêu và vòng đời rõ ràng. Mã chưa đủ điều kiện chỉ được ghi là theo dõi.', 'Radar rà soát 30 mã cân bằng theo ngành; tín hiệu hành động chỉ hiển thị khi setup đạt chuẩn.')
          status = f'''<div class="home-recommendation-status">
        <article><span>Tín hiệu hành động hiện tại</span><strong>0 mã</strong><small>Không có setup đạt chuẩn tại snapshot công khai hiện tại.</small></article>
        <article><span>{LABEL}</span><strong>30 mã</strong><small>10 ngành · 3 mã mỗi ngành; danh sách rà soát không phải khuyến nghị mua.</small></article>
      </div>'''
          reco = sub_once(r'<div class="home-recommendation-status">.*?<section class="recommendation-reference-list"', status + '\n\n      <section class="recommendation-reference-list"', reco)
          rows = '\n'.join(f'          <div class="reference-watch-row"><b>{x["ticker"]}</b><span>{x["sector"]}</span><em>RÀ SOÁT</em><small>Đang rà soát</small></div>' for x in ITEMS)
          review_section = f'''<section class="recommendation-reference-list" aria-labelledby="reference-watch-title">
        <header><div><span class="panel-label">RADAR RÀ SOÁT</span><h2 id="reference-watch-title">{LABEL} · 30 mã</h2></div><a class="button button-secondary button-small" href="kiem-tra-co-phieu/">Tra cứu từng mã</a></header>
        <div class="reference-watch-table">
          <div class="reference-watch-head"><span>Mã</span><span>Ngành</span><span>Trạng thái</span><span>Đánh giá hiện tại</span></div>
{rows}
        </div>
        <p class="recommendation-reference-note">{LABEL} là phạm vi rà soát cân bằng ngành của StockRadar, không phải khuyến nghị mua. Khi một setup đạt chuẩn hành động, StockRadar mới hiển thị Buy Zone, Stop-loss, Target, Upside/Downside và Risk/Reward.</p>
      </section>'''
          reco = sub_once(r'<section class="recommendation-reference-list".*?</section>', review_section, reco)
          reco = reco.replace('Không gắn nhãn khuyến nghị cho mã chỉ đang nằm trong danh mục tham chiếu.', f'{LABEL} không đồng nghĩa khuyến nghị mua.')
          reco_path.write_text(reco, encoding='utf-8')

          # Runtime wording: protect new naming on dynamically inserted fallback surfaces.
          copy_path = ROOT / 'website/assets/public-copy-v7.js'
          copy = copy_path.read_text(encoding='utf-8')
          marker = "  const replacements = [\n"
          additions = "    ['Danh sách cổ phiếu đang theo dõi', 'Danh sách cổ phiếu theo Radar rà soát'],\n    ['Mã tham chiếu đang theo dõi', 'Danh sách cổ phiếu theo Radar rà soát'],\n    ['danh sách cổ phiếu theo dõi', 'danh sách cổ phiếu theo Radar rà soát'],\n"
          if additions.strip() not in copy:
              copy = copy.replace(marker, marker + additions, 1)
          copy_path.write_text(copy, encoding='utf-8')

          fallback_path = ROOT / 'website/assets/public-fallbacks-v4.js'
          fallback = fallback_path.read_text(encoding='utf-8')
          fallback = fallback.replace('<em>THEO DÕI</em>', '<em>RÀ SOÁT</em>')
          fallback = fallback.replace('<span class="panel-label">DỮ LIỆU THAM CHIẾU</span>', '<span class="panel-label">RADAR RÀ SOÁT</span>')
          fallback = fallback.replace("title: `${items.length} mã HOSE đang theo dõi`", "title: `Danh sách cổ phiếu theo Radar rà soát · ${items.length} mã`")
          fallback = fallback.replace('Mã tham chiếu', 'Mã Radar rà soát')
          fallback = fallback.replace('mã tham chiếu', 'mã Radar rà soát')
          fallback = fallback.replace('Đang theo dõi', 'Radar rà soát')
          fallback = fallback.replace('đang theo dõi', 'được Radar rà soát')
          fallback_path.write_text(fallback, encoding='utf-8')

          # Existing product tests follow the new public wording/count.
          test_path = ROOT / 'engine/tests/test_email_subscription_funnel.py'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('Danh sách cổ phiếu đang theo dõi', LABEL)
          test = test.replace('Mã tham chiếu đang theo dõi', LABEL)
          test = test.replace('"16 mã"', '"30 mã"')
          test_path.write_text(test, encoding='utf-8')

          # Dedicated invariant test: exactly 30 tickers, 10 sectors, 3 per sector.
          invariant = '''from collections import Counter\nfrom pathlib import Path\nimport json\nimport unittest\n\nROOT = Path(__file__).resolve().parents[2]\n\nclass RadarReview30Tests(unittest.TestCase):\n    def test_balanced_radar_review_universe(self):\n        payload = json.loads((ROOT / "website/public/data/ticker-universe.json").read_text(encoding="utf-8"))\n        items = payload["items"]\n        self.assertEqual(payload.get("selection_label"), "Danh sách cổ phiếu theo Radar rà soát")\n        self.assertEqual(payload.get("selection_kind"), "RADAR_REVIEW_BALANCED_30")\n        self.assertEqual(len(items), 30)\n        self.assertTrue(all(item.get("exchange") == "HOSE" for item in items))\n        counts = Counter(item["sector"] for item in items)\n        self.assertEqual(len(counts), 10)\n        self.assertEqual(set(counts.values()), {3})\n        self.assertEqual(payload.get("balanced_sector_count"), 10)\n        self.assertEqual(payload.get("per_sector"), 3)\n\n    def test_public_pages_use_radar_review_wording(self):\n        home = (ROOT / "website/index.html").read_text(encoding="utf-8")\n        reco = (ROOT / "website/khuyen-nghi/index.html").read_text(encoding="utf-8")\n        for source in (home, reco):\n            self.assertIn("Danh sách cổ phiếu theo Radar rà soát", source)\n            self.assertIn("30 mã", source)\n        for ticker in ("NKG", "CMG", "ELC", "PLX", "PVD", "FRT", "DGW", "VHM", "KDH", "POW", "REE", "GEG", "GMD", "VSC", "HAH"):\n            self.assertIn(f">{ticker}<", home)\n            self.assertIn(f">{ticker}<", reco)\n        self.assertNotIn("Danh sách cổ phiếu đang theo dõi", home)\n        self.assertNotIn("Mã tham chiếu đang theo dõi", reco)\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          (ROOT / 'engine/tests/test_radar_review_30.py').write_text(invariant, encoding='utf-8')

          # Production verifier checks the built artifact and the 10x3 invariant.
          verifier_path = ROOT / 'scripts/verify_pages_public_surface.py'
          verifier = verifier_path.read_text(encoding='utf-8')
          if 'from collections import Counter' not in verifier:
              verifier = verifier.replace('import argparse\n', 'import argparse\nimport json\nfrom collections import Counter\n', 1)
          verifier = verifier.replace("'Danh sách cổ phiếu đang theo dõi',", "'Danh sách cổ phiếu theo Radar rà soát',")
          verifier = verifier.replace("'<strong>16 mã</strong>',", "'<strong>30 mã</strong>',")
          verifier = verifier.replace("'Mã tham chiếu đang theo dõi',", "'Danh sách cổ phiếu theo Radar rà soát',")
          verifier = verifier.replace("'<b>VNM</b>',", "'<b>VNM</b>',\n            '<b>NKG</b>',\n            '<b>HAH</b>',")
          verify_anchor = '    require_text(\n        output,\n        "signup/index.html",\n'
          check_block = '''    universe_path = output / "public" / "data" / "ticker-universe.json"\n    if not universe_path.is_file():\n        errors.append("Radar review universe missing")\n    else:\n        payload = json.loads(universe_path.read_text(encoding="utf-8"))\n        items = payload.get("items", [])\n        counts = Counter(item.get("sector") for item in items)\n        if payload.get("selection_label") != "Danh sách cổ phiếu theo Radar rà soát":\n            errors.append("Radar review label mismatch")\n        if len(items) != 30:\n            errors.append(f"Radar review must contain 30 tickers, got {len(items)}")\n        if len(counts) != 10 or set(counts.values()) != {3}:\n            errors.append(f"Radar review sector balance must be 10x3, got {dict(counts)}")\n        if any(item.get("exchange") != "HOSE" for item in items):\n            errors.append("Radar review contains non-HOSE ticker")\n\n'''
          if check_block not in verifier:
              verifier = verifier.replace(verify_anchor, check_block + verify_anchor, 1)
          verifier_path.write_text(verifier, encoding='utf-8')

          # Remove this one-shot workflow from the resulting branch commit.
          Path('.github/workflows/radar-review-30-migrate.yml').unlink()
          PY
      - name: Commit migrated source
        run: |
          git config user.name "nguyenlinhns-arch"
          git config user.email "nguyenlinhns@gmail.com"
          git add -A
          git commit -m "Expand Radar review list to 30 balanced HOSE stocks"
          git push origin HEAD:radar-review-30-v8-production
