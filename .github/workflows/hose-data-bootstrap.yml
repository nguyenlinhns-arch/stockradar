name: StockRadar HOSE Data Bootstrap

# Full-universe invariant: the collector must resolve at least 405 HOSE tickers before a run can pass.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_kbs_hose_data.py'
      - 'scripts/build_bootstrap_derived_features_v2.py'
      - 'scripts/build_internal_scanner_feed_v2.py'
      - 'scripts/validate_intraday_scan_sla.py'
      - '.github/workflows/hose-data-bootstrap.yml'
  schedule:
    # Vietnam: 10:30, 11:15, 13:30, 14:15 and 15:25 on trading weekdays.
    - cron: '30 3 * * 1-5'
    - cron: '15 4 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '25 8 * * 1-5'

permissions:
  contents: read
  actions: read

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install --disable-pip-version-check pandas requests
      - name: Acquire HOSE market data and technical feature store
        run: python scripts/bootstrap_kbs_hose_data.py --mode market --output-dir artifacts/market
      - name: Upload internal market artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-hose-market-bootstrap
          path: artifacts/market/
          retention-days: 7
          if-no-files-found: error

  fundamentals:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '25 8 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install --disable-pip-version-check pandas requests
      - name: Acquire HOSE company profiles, financial statements and events
        run: python scripts/bootstrap_kbs_hose_data.py --mode fundamentals --output-dir artifacts/fundamentals
      - name: Upload internal fundamentals artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-hose-fundamentals-bootstrap
          path: artifacts/fundamentals/
          retention-days: 30
          if-no-files-found: error

  scanner:
    needs: [market, fundamentals]
    if: ${{ always() && needs.market.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: pip install --disable-pip-version-check pandas numpy requests

      - name: Download market artifact from this run
        uses: actions/download-artifact@v4
        with:
          name: stockradar-hose-market-bootstrap
          path: artifacts/market

      - name: Download fundamentals from this run
        if: ${{ needs.fundamentals.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: stockradar-hose-fundamentals-bootstrap
          path: artifacts/fundamentals

      - name: Reuse latest non-expired fundamentals artifact
        if: ${{ needs.fundamentals.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fundamentals
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=stockradar-hose-fundamentals-bootstrap&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo 'No reusable fundamentals artifact found; scanner remains fail-closed.' >&2
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/fundamentals.zip
          unzip -q -o /tmp/fundamentals.zip -d artifacts/fundamentals

      - name: Derive fundamental, relative-strength and valuation features
        run: |
          python scripts/build_bootstrap_derived_features_v2.py \
            --financial-statements artifacts/fundamentals/financial_statements_long.csv \
            --ohlcv artifacts/market/ohlcv.csv \
            --vnindex-daily artifacts/market/vnindex_daily.csv \
            --technical artifacts/market/technical_features_bootstrap.csv \
            --output-dir artifacts/derived

      - name: Build full-HOSE scanner and internal website feed
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          python scripts/build_internal_scanner_feed_v2.py \
            --universe artifacts/market/security_master.csv \
            --security-master artifacts/market/security_master.csv \
            --technical artifacts/market/technical_features_bootstrap.csv \
            --fundamental artifacts/derived/fundamental_features_bootstrap.csv \
            --relative-strength artifacts/derived/relative_strength_bootstrap.csv \
            --snapshot artifacts/market/latest_snapshot.csv \
            --valuation artifacts/derived/valuation_bootstrap.csv \
            --output-dir artifacts/scanner \
            --as-of "$as_of"

      - name: Enforce scanner QA and public-data gate
        shell: bash
        run: |
          set -euo pipefail
          qa_file="$(ls artifacts/scanner/stockradar_scanner_qa_v2_*.json | head -n 1)"
          python - "$qa_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as handle:
              qa = json.load(handle)
          assertions = qa.get('assertions', {})
          required = (
              'universe_exact_405',
              'all_inputs_cover_405',
              'all_tickers_valid_alphanumeric_hose_format',
              'website_feed_strips_scan_priority_internal',
          )
          failed = [name for name in required if assertions.get(name) is not True]
          if qa.get('canonical_hose_count') != 405:
              failed.append('canonical_hose_count')
          if qa.get('public_gate', {}).get('allowed') is not False:
              failed.append('bootstrap_public_gate_must_remain_closed')
          if failed:
              raise SystemExit(f"Scanner QA failed: {failed}")
          print(json.dumps({
              'canonical_hose_count': qa['canonical_hose_count'],
              'full_scan_eligible': qa['full_scan_eligible'],
              'liquidity_vol20_ge_500k': qa['liquidity_vol20_ge_500k'],
              'setup_counts': qa['setup_counts'],
              'public_gate': qa['public_gate'],
          }, ensure_ascii=False))
          PY

      - name: Enforce 4-checkpoint freshness and liquidity SLA
        shell: bash
        run: |
          set -euo pipefail
          qa_file="$(ls artifacts/scanner/stockradar_scanner_qa_v2_*.json | head -n 1)"
          scanner_file="$(ls artifacts/scanner/stockradar_scanner_master_v2_405_*.csv | head -n 1)"
          python scripts/validate_intraday_scan_sla.py \
            --market-coverage artifacts/market/market_coverage.json \
            --fundamental-coverage artifacts/fundamentals/fundamentals_coverage.json \
            --scanner-qa "$qa_file" \
            --scanner "$scanner_file" \
            --intraday artifacts/market/intraday_5m.csv \
            --output artifacts/scanner/stockradar_intraday_sla_v1.json

      - name: Upload internal scanner artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-hose-scanner-v2
          path: |
            artifacts/derived/
            artifacts/scanner/
          retention-days: 14
          if-no-files-found: error
