name: Verify and deploy StockRadar Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'engine/**'
      - 'scripts/build_pages.py'
      - 'scripts/fail_close_public_ticker_seed.py'
      - 'scripts/inject_public_ux.py'
      - 'scripts/inject_home_radar_polish.py'
      - 'scripts/upgrade_home_radar_operational.py'
      - 'scripts/apply_buyer_readiness.py'
      - 'scripts/redesign_home_value_block.py'
      - 'scripts/apply_conversion_v3.py'
      - 'scripts/link_premium_sample.py'
      - 'scripts/patch_conversion_funnel_v4.py'
      - 'scripts/redesign_home_paid_intent_v1.py'
      - 'scripts/apply_premium_email_product_v1.py'
      - 'scripts/apply_ai_first_premium_email.py'
      - 'scripts/strip_public_methods.py'
      - 'scripts/inject_ai_assistant.py'
      - 'scripts/enforce_registration_plan_ctas.py'
      - 'scripts/enforce_checkout_public_bank_info.py'
      - 'scripts/enforce_ai_registration_ctas.py'
      - 'scripts/normalize_commercial_pricing.py'
      - 'scripts/apply_commercial_surface_v1.py'
      - 'scripts/apply_commercial_surface_v2.py'
      - 'scripts/fix_commercial_auth_headings.py'
      - 'scripts/apply_commercial_runtime_v2.py'
      - 'scripts/apply_commercial_support_v1.py'
      - 'scripts/verify*.py'
      - 'scripts/visual_qa.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==3.0.5
      - name: Build public data
        run: python -m engine.cli build-public
      - name: Run regression suite
        run: python -m unittest discover -s engine/tests -v
      - name: Fail-close public ticker seed before Pages build
        run: python scripts/fail_close_public_ticker_seed.py website/public/data/ticker-universe.json
      - name: Build static Pages artifact
        env:
          STOCKRADAR_ENABLE_AUTH: "1"
          STOCKRADAR_AUTH_EMAIL_READY: "0"
          STOCKRADAR_SUPABASE_URL: "https://xamviatbxufjlpiwhebb.supabase.co"
          STOCKRADAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Ne0TfBw0Iu732yrhqRcdIA_hPGxYDAK"
        run: python scripts/build_pages.py --output .pages-site
      - name: Apply production-facing UX guards
        env:
          STOCKRADAR_PRODUCT_EMAIL_READY: "0"
          STOCKRADAR_CHECKOUT_READY: "1"
        run: |
          python scripts/inject_public_ux.py .pages-site
          python scripts/inject_home_radar_polish.py .pages-site
          python scripts/upgrade_home_radar_operational.py .pages-site
          python scripts/apply_buyer_readiness.py .pages-site
          python scripts/redesign_home_value_block.py .pages-site
          python scripts/apply_conversion_v3.py .pages-site
          python scripts/link_premium_sample.py .pages-site
          python scripts/patch_conversion_funnel_v4.py .pages-site
          if grep -q 'data-stockradar-ai-center' .pages-site/index.html; then
            python scripts/apply_ai_first_premium_email.py .pages-site
          else
            python scripts/redesign_home_paid_intent_v1.py .pages-site
            python scripts/apply_premium_email_product_v1.py .pages-site
          fi
          python scripts/strip_public_methods.py .pages-site
          python scripts/inject_ai_assistant.py .pages-site
          python scripts/enforce_registration_plan_ctas.py .pages-site
          python scripts/enforce_checkout_public_bank_info.py .pages-site
          python scripts/enforce_ai_registration_ctas.py .pages-site
      - name: Verify production auth artifact
        run: python scripts/verify_pages_auth.py .pages-site
      - name: Verify AI-first or legacy product contract
        run: |
          if grep -q 'data-stockradar-ai-center' .pages-site/index.html; then
            python scripts/verify_ai_first_product.py .pages-site
            python scripts/verify_ai_assistant.py .pages-site
          else
            python scripts/verify_pages_public_surface_paid_home_v1.py .pages-site
            python scripts/verify_buyer_readiness.py .pages-site
            python scripts/verify_conversion_paid_home_v1.py .pages-site
            python scripts/verify_home_paid_intent_v1.py .pages-site
            python scripts/verify_premium_email_product_v1.py .pages-site
            python scripts/verify_conversion_funnel_v4.py .pages-site
            python scripts/verify_ai_assistant.py .pages-site
          fi
      - name: Assert live checkout survives final transforms
        run: |
          grep -q 'VPBank' .pages-site/thanh-toan/index.html
          grep -q '0934389822' .pages-site/thanh-toan/index.html
          grep -q 'vpbank-qr-static.svg' .pages-site/thanh-toan/index.html
          grep -q 'data-checkout-confirm' .pages-site/thanh-toan/index.html
          ! grep -q 'BẢO VỆ NGƯỜI DÙNG TRẢ PHÍ' .pages-site/thanh-toan/index.html
          ! grep -q 'Premium tạm dừng kích hoạt mới' .pages-site/thanh-toan/index.html
      - name: Apply final commercial surface
        run: |
          python scripts/normalize_commercial_pricing.py .pages-site
          python scripts/apply_commercial_surface_v1.py .pages-site
          python scripts/apply_commercial_surface_v2.py .pages-site
          python scripts/fix_commercial_auth_headings.py .pages-site
          python scripts/apply_commercial_runtime_v2.py .pages-site
          python scripts/apply_commercial_support_v1.py .pages-site
      - name: Install Chromium visual QA
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium
      - name: Run multi-viewport visual QA
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory .pages-site >/tmp/stockradar-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then cat /tmp/stockradar-http.log; exit 1; fi
          STOCKRADAR_QA_URL=http://127.0.0.1:8765 npm run visual-qa
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
