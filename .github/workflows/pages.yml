name: Verify and deploy StockRadar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==3.0.5

      - name: Build fail-closed public data
        run: python -m engine.cli build-public

      - name: Run regression suite
        run: python -m unittest discover -s engine/tests -v

      - name: Build static Pages artifact
        env:
          STOCKRADAR_ENABLE_AUTH: "1"
          STOCKRADAR_AUTH_EMAIL_READY: "0"
          STOCKRADAR_SUPABASE_URL: "https://xamviatbxufjlpiwhebb.supabase.co"
          STOCKRADAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Ne0TfBw0Iu732yrhqRcdIA_hPGxYDAK"
        run: python scripts/build_pages.py --output .pages-site

      - name: Apply production-facing UX guards
        env:
          STOCKRADAR_PRODUCT_EMAIL_READY: "0"
          STOCKRADAR_CHECKOUT_READY: "0"
        run: |
          python scripts/inject_public_ux.py .pages-site
          python scripts/inject_home_radar_polish.py .pages-site
          python scripts/apply_buyer_readiness.py .pages-site
          python scripts/strip_public_methods.py .pages-site

      - name: Verify production auth artifact
        run: python scripts/verify_pages_auth.py .pages-site

      - name: Verify production public surface
        run: python scripts/verify_pages_public_surface.py .pages-site

      - name: Verify buyer-ready product surface
        run: python scripts/verify_buyer_readiness.py .pages-site

      - name: Install Chromium visual QA
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium

      - name: Run multi-viewport visual QA
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory .pages-site >/tmp/stockradar-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/stockradar-http.log
            exit 1
          fi
          STOCKRADAR_QA_URL=http://127.0.0.1:8765 npm run visual-qa

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
