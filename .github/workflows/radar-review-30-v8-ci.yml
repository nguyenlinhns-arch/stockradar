name: Validate Radar Review 30 V8

on:
  push:
    branches:
      - radar-review-30-v8-production

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check JavaScript syntax
        run: |
          node --check website/assets/public-copy-v7.js
          node --check website/assets/public-fallbacks-v4.js
          node --check website/assets/header-auth-dedupe-v6.js
      - name: Build fail-closed public data
        run: python -m engine.cli build-public
      - name: Verify 30 by 10 by 3 universe
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=json.loads(Path('website/public/data/ticker-universe.json').read_text(encoding='utf-8'))
          items=p['items']
          c=Counter(x['sector'] for x in items)
          assert len(items)==30, len(items)
          assert len(c)==10, c
          assert set(c.values())=={3}, c
          assert all(x['exchange']=='HOSE' for x in items)
          print(c)
          PY
      - name: Run regression suite
        run: python -m unittest discover -s engine/tests -v
      - name: Build and verify production Pages artifact
        env:
          STOCKRADAR_ENABLE_AUTH: "1"
          STOCKRADAR_AUTH_EMAIL_READY: "0"
          STOCKRADAR_SUPABASE_URL: "https://xamviatbxufjlpiwhebb.supabase.co"
          STOCKRADAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Ne0TfBw0Iu732yrhqRcdIA_hPGxYDAK"
        run: |
          python scripts/build_pages.py --output .pages-site
          python scripts/inject_public_ux.py .pages-site
          python scripts/verify_pages_auth.py .pages-site
          python scripts/verify_pages_public_surface.py .pages-site
          grep -q 'Danh sách cổ phiếu theo Radar rà soát' .pages-site/index.html
          grep -q '<strong>30 mã</strong>' .pages-site/index.html
          grep -q '<b>NKG</b>' .pages-site/index.html
          grep -q '<b>HAH</b>' .pages-site/index.html
