name: Repair and verify project knowledge bridge
on:
  push:
    branches: ['feat/project-knowledge-bridge-20260907']
    paths:
      - 'scripts/apply_project_knowledge_bridge.py'
      - 'scripts/project_knowledge_bridge_test.mjs'
      - 'supabase/functions/_shared/stockradar-knowledge.ts'
      - 'engine/tests/test_project_knowledge_bridge.py'
      - '.github/workflows/project-knowledge-bridge.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: project-knowledge-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair-and-test:
    if: github.ref == 'refs/heads/feat/project-knowledge-bridge-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact-source patch
        run: python scripts/apply_project_knowledge_bridge.py
      - name: Verify behavior and endpoint integration
        run: |
          node --test scripts/project_knowledge_bridge_test.mjs
          python -m unittest discover -s engine/tests -p test_project_knowledge_bridge.py -v
          node --input-type=module --check < supabase/functions/stock-ai/index.ts
          node --input-type=module --check < supabase/functions/stock-ai-guest/index.ts
          git diff --check
      - name: Commit verified endpoint changes to the feature branch only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'StockRadar bridge verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/stock-ai/index.ts supabase/functions/stock-ai-guest/index.ts supabase/functions/stock-ai-chat/index.ts STOCKRADAR_BUILD_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Wire all AI endpoints to reviewed project knowledge'
            git push origin "HEAD:$BRANCH_NAME"
          fi
          echo "Verified source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
