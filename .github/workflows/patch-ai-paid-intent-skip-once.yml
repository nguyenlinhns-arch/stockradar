name: Patch AI paid-intent skip once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ai-paid-intent-skip-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main
        run: git pull --ff-only origin main
      - name: Patch legacy paid-intent transform
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/redesign_home_paid_intent_v1.py')
          text = path.read_text(encoding='utf-8')
          old = '''    source = home.read_text(encoding="utf-8")
    start = source.find('<section class="home-decision-v2"')
    end = source.find("</main>")
    if start < 0 or end < 0 or start >= end:
        raise RuntimeError("Could not locate homepage conversion body")
'''
          new = '''    source = home.read_text(encoding="utf-8")
    if "data-stockradar-ai-center" in source:
        source = enforce_paid_only_email_copy(source)
        home.write_text(source, encoding="utf-8")
        print("Homepage paid-intent v1: SKIP (AI-first homepage owns current buyer journey)")
        return

    start = source.find('<section class="home-decision-v2"')
    end = source.find("</main>")
    if start < 0 or end < 0 or start >= end:
        raise RuntimeError("Could not locate homepage conversion body")
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'SKIP (AI-first homepage owns current buyer journey)' not in text:
              raise SystemExit('paid-intent transform target not found')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/patch-ai-paid-intent-skip-once.yml').unlink()
          PY
      - name: Smoke-check patched script source
        run: |
          grep -q 'data-stockradar-ai-center' scripts/redesign_home_paid_intent_v1.py
          grep -q 'AI-first homepage owns current buyer journey' scripts/redesign_home_paid_intent_v1.py
      - name: Commit patch
        run: |
          git config user.name stockradar-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Make legacy paid-intent transform AI-first compatible'
          git pull --rebase origin main
          git push origin HEAD:main
