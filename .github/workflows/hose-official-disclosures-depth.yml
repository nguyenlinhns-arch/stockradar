name: StockRadar HOSE Official Disclosure Depth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/acquire_hose_official_disclosures_v1.py'
      - '.github/workflows/hose-official-disclosures-depth.yml'
  schedule:
    # 16:05 Asia/Ho_Chi_Minh on trading weekdays.
    - cron: '5 9 * * 1-5'

permissions:
  contents: read
  actions: read

jobs:
  official-disclosure-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas requests

      - name: Reuse latest non-expired HOSE market artifact for canonical universe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/market
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=stockradar-hose-market-bootstrap&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo 'No reusable market artifact found.' >&2
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market.zip
          unzip -q -o /tmp/market.zip -d artifacts/market

      - name: Acquire 120-day official HOSE disclosure depth
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          python scripts/acquire_hose_official_disclosures_v1.py \
            --universe artifacts/market/security_master.csv \
            --as-of "$as_of" \
            --lookback-days 120 \
            --include-media-days 0 \
            --workers 12 \
            --output-dir artifacts/hose-official-depth

      - name: Enforce official-depth QA and fail-closed policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          manifest = json.loads(Path('artifacts/hose-official-depth/hose_official_disclosures_manifest.json').read_text(encoding='utf-8'))
          coverage = pd.read_csv('artifacts/hose-official-depth/hose_official_disclosures_coverage_405.csv')
          history = pd.read_csv('artifacts/hose-official-depth/hose_official_disclosures_history.csv')
          failures = []
          if manifest.get('canonical_hose') != 405 or len(coverage) != 405 or coverage['ticker'].nunique() != 405:
              failures.append('CANONICAL_HOSE_NOT_405')
          if float(manifest.get('ticker_query_coverage_ratio') or 0) < 0.98:
              failures.append('TICKER_QUERY_COVERAGE_LT_98PCT')
          if manifest.get('source_ready_internal') is not True:
              failures.append('SOURCE_NOT_READY')
          if int(manifest.get('row_count') or 0) <= 0 or len(history) <= 0:
              failures.append('ZERO_HISTORY')
          if manifest.get('catalyst_alpha_weight_allowed') is not False:
              failures.append('CATALYST_ALPHA_MUST_REMAIN_ZERO')
          if manifest.get('publication_allowed') is not False:
              failures.append('PUBLICATION_MUST_REMAIN_CLOSED')
          if failures:
              raise SystemExit('HOSE official depth QA failed: ' + ','.join(failures))
          print(json.dumps({
              'ticker_query_coverage_ratio': manifest.get('ticker_query_coverage_ratio'),
              'row_count': manifest.get('row_count'),
              'tickers_with_rows': manifest.get('tickers_with_rows'),
              'tickers_with_rows_30d': manifest.get('tickers_with_rows_30d'),
              'latest_updated_at': manifest.get('latest_updated_at'),
              'source_ready_internal': True,
              'publication_allowed': False,
          }, ensure_ascii=False))
          PY

      - name: Upload internal official-depth artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-hose-official-disclosures-depth-v1
          path: artifacts/hose-official-depth/
          retention-days: 30
          if-no-files-found: error
