name: Repair Domain V4 sector join

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_domain_sector_join_once.py'
      - '.github/workflows/repair-domain-sector-join.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow domain V4 sector repair
        run: python scripts/repair_domain_sector_join_once.py
      - name: Commit repaired domain builder
        run: |
          git config user.name stockradar-bot
          git config user.email stockradar-bot@users.noreply.github.com
          git add scripts/build_domain_fundamental_valuation_v4.py
          if git diff --cached --quiet; then
            echo 'Domain V4 sector join already repaired.'
          else
            git commit -m 'Fix Domain V4 sector join collision'
            git push
          fi
