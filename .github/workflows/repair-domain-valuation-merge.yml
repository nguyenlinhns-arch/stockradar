name: Repair Domain V4 valuation merge

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_domain_valuation_merge_once.py'
      - '.github/workflows/repair-domain-valuation-merge.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow valuation merge repair
        run: python scripts/repair_domain_valuation_merge_once.py
      - name: Commit repaired Domain V4 builder
        run: |
          git config user.name stockradar-bot
          git config user.email stockradar-bot@users.noreply.github.com
          git add scripts/build_domain_fundamental_valuation_v4.py
          if git diff --cached --quiet; then
            echo 'Domain V4 valuation merge already repaired.'
          else
            git commit -m 'Fix duplicate valuation merge in Domain V4'
            git push
          fi
