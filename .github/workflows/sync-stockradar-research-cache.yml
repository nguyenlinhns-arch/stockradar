# Bootstrap trigger: 2026-09-04
name: Sync StockRadar Research Cache

on:
  workflow_run:
    workflows: ["StockRadar Publish Internal Research Bundle"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-stockradar-research-cache.yml"
      - "scripts/sync_internal_research_cache.py"
      - "supabase/functions/stock-research-sync/**"
  schedule:
    # Vietnam: 08:30 morning recovery, four intraday refreshes, 16:30 post-close recovery and 20:05 final retry.
    - cron: "30 1 * * 1-5"
    - cron: "40 3 * * 1-5"
    - cron: "25 4 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "25 7 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "5 13 * * 1-5"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: stockradar-research-cache-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download validated internal ticker lookup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stockradar-bundle
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${EVENT_RUN_ID:-}" ]; then
            artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "stockradar-ticker-lookup-internal-v1" and .expired == false)) | .[0].id // empty')"
          else
            artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=stockradar-ticker-lookup-internal-v1&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          fi
          if [ -z "$artifact_id" ]; then
            echo 'No validated internal StockRadar bundle artifact found.' >&2
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/stockradar-bundle.zip
          unzip -q -o /tmp/stockradar-bundle.zip -d /tmp/stockradar-bundle
          bundle="$(find /tmp/stockradar-bundle -name 'stockradar_ticker_lookup_internal_405_*.json' ! -name '*_manifest.json' -print -quit)"
          if [ -z "$bundle" ]; then
            echo 'Validated bundle JSON missing from artifact.' >&2
            exit 1
          fi
          cp "$bundle" /tmp/stockradar-research-bundle.json
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/stockradar-research-bundle.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
              'artifact_bundle':p.name,
              'size':p.stat().st_size,
              'as_of_date':d.get('as_of_date'),
              'universe_count':d.get('universe_count'),
              'internal_research_ready_count':d.get('internal_research_ready_count'),
          }, ensure_ascii=False))
          PY

      - name: Validate bundle locally
        run: python scripts/sync_internal_research_cache.py /tmp/stockradar-research-bundle.json --dry-run

      - name: Obtain GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=stockradar-supabase-sync")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Sync bundle into private StockRadar research cache
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer ${GITHUB_OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/stockradar-research-bundle.json \
            "https://xamviatbxufjlpiwhebb.supabase.co/functions/v1/stock-research-sync" \
            | tee /tmp/stockradar-sync-result.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/stockradar-sync-result.json', encoding='utf-8'))
          if data.get('status') not in {'SYNCED', 'ALREADY_SYNCED'}:
              raise SystemExit(f"Unexpected sync status: {data}")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY