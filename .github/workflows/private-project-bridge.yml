name: Verify private project conversation bridge
on:
  push:
    branches: ['feat/private-project-chat-bridge-20260907']
    paths:
      - 'scripts/apply_private_project_bridge.py'
      - 'scripts/private_project_bridge_test.mjs'
      - 'supabase/functions/_shared/stockradar-project-context.ts'
      - 'engine/tests/private_project_chat.test.mjs'
      - '.github/workflows/private-project-bridge.yml'
permissions:
  contents: write
concurrency:
  group: private-project-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pandas==3.0.5 requests==2.34.2 pytest==9.1.1
      - name: Apply exact-source bridge patch
        run: python scripts/apply_private_project_bridge.py
      - name: Test private handoff, real chat handler, all existing regressions and syntax
        run: |
          node --test scripts/private_project_bridge_test.mjs
          node --test engine/tests/*.test.mjs
          python -m unittest discover -s engine/tests
          python -m pytest engine/tests -q
          node --check website/assets/ai-center.js
          git diff --check
      - name: Commit verified source to the feature branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'StockRadar bridge verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/stock-ai-chat/index.ts supabase/functions/stock-ai/index.ts supabase/functions/_shared/stockradar-query.ts website/assets/ai-center.js engine/tests/ai_handlers.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Connect reviewed private project context to continuous website chat'
            git push origin "HEAD:$BRANCH_NAME"
          fi
          echo "Verified source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
