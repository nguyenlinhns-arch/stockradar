name: Validate StockRadar public data scope

on:
  push:
    branches: [tighten-public-data-scope-20260903]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/inject_public_ux.py
          node --check website/assets/public-ux.js
          node --check website/assets/auth-production-gate.js

      - name: Build fail-closed public data
        run: python -m engine.cli build-public

      - name: Run regression suite
        run: python -m unittest discover -s engine/tests -v

      - name: Build static Pages artifact
        env:
          STOCKRADAR_ENABLE_AUTH: "1"
          STOCKRADAR_AUTH_EMAIL_READY: "0"
          STOCKRADAR_SUPABASE_URL: "https://xamviatbxufjlpiwhebb.supabase.co"
          STOCKRADAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Ne0TfBw0Iu732yrhqRcdIA_hPGxYDAK"
        run: python scripts/build_pages.py --output .pages-site

      - name: Apply production-facing UX guards
        run: python scripts/inject_public_ux.py .pages-site

      - name: Verify production auth artifact
        run: python scripts/verify_pages_auth.py .pages-site

      - name: Verify public data scope
        run: |
          grep -q '20260903-public2' .pages-site/index.html
          grep -q '16 MÃ THAM CHIẾU' website/assets/public-ux.js
          grep -q 'noindex,nofollow' .pages-site/co-phieu/demo1/index.html
          ! grep -q 'KHÔNG PHẢI CỔ PHIẾU THẬT' .pages-site/co-phieu/demo1/index.html
