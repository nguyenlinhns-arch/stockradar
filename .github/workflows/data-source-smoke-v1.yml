name: Smoke raw Vietnam data source

on:
  push:
    branches: [data-source-smoke-v1]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install current community data client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'vnstock==4.0.7' 'pandas<3'
      - name: Fetch raw listing OHLCV and statement line-items
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from vnstock import Reference, Fundamental
          from vnstock.ui import Market

          def shape(df): return list(getattr(df, 'shape', (0, 0)))
          def cols(df): return [str(c) for c in getattr(df, 'columns', [])]

          ref = Reference()
          exchanges = ref.equity.list_by_exchange()
          if not isinstance(exchanges, pd.DataFrame) or exchanges.empty:
              raise RuntimeError('Reference exchange list is empty')

          mkt = Market()
          px = mkt.equity('HPG').ohlcv(start='2025-01-01', end='2026-09-04', interval='1D')
          required_px = {'time','open','high','low','close','volume'}
          if not required_px.issubset(set(map(str, px.columns))):
              raise RuntimeError(f'OHLCV schema missing columns: {cols(px)}')
          if len(px) < 250:
              raise RuntimeError(f'OHLCV history too short: {len(px)}')

          fun = Fundamental()
          income = fun.equity('HPG').income_statement(period='quarter', orient='time_series')
          balance = fun.equity('HPG').balance_sheet(period='quarter', orient='time_series')
          cash = fun.equity('HPG').cash_flow(period='quarter', orient='time_series')
          if min(len(income), len(balance), len(cash)) == 0:
              raise RuntimeError('One or more raw statement tables are empty')

          info = ref.company('HPG').info()
          print(json.dumps({
              'provider_role': 'RAW_INPUT_ONLY',
              'exchange_shape': shape(exchanges),
              'exchange_columns': cols(exchanges),
              'ohlcv_shape': shape(px),
              'ohlcv_columns': cols(px),
              'income_shape': shape(income),
              'income_columns': cols(income)[:50],
              'balance_shape': shape(balance),
              'balance_columns': cols(balance)[:50],
              'cashflow_shape': shape(cash),
              'cashflow_columns': cols(cash)[:50],
              'company_shape': shape(info),
              'company_columns': cols(info)[:50],
          }, ensure_ascii=False, indent=2))
          PY
