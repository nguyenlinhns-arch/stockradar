name: Smoke official HOSE disclosures

on:
  push:
    branches: [data-source-smoke-v1]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser client
        run: |
          google-chrome --version || chromium-browser --version || chromium --version
          python -m pip install selenium beautifulsoup4
      - name: Query official HOSE disclosures inside browser session
        run: |
          python - <<'PY'
          import json, re, urllib.parse, time
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          category='dca0933e-a578-4eaf-8b29-beb4575052c5'
          referer=f'https://www.hsx.vn/Modules/Cms/Web/NewsByCat/{category}?fid=6d1f1d5e9e6c4fb593077d461e5155e7'
          params={
              'exclude':'00000000-0000-0000-0000-000000000000','lim':'True',
              'pageFieldName1':'FromDate','pageFieldValue1':'01.01.2026','pageFieldOperator1':'eq',
              'pageFieldName2':'ToDate','pageFieldValue2':'04.09.2026','pageFieldOperator2':'eq',
              'pageFieldName3':'TokenCode','pageFieldValue3':'HPG','pageFieldOperator3':'eq',
              'pageFieldName4':'CategoryId','pageFieldValue4':category,'pageFieldOperator4':'eq',
              'pageCriteriaLength':'4','_search':'false','rows':'300','page':'1','sidx':'id','sord':'desc',
          }
          query=urllib.parse.urlencode(params)
          endpoint=f'/Modules/CMS/Web/ArticleInCategory/{category}?{query}'

          options=Options()
          options.add_argument('--headless=new'); options.add_argument('--no-sandbox'); options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu'); options.add_argument('--window-size=1440,1200')
          options.add_argument('--lang=vi-VN'); options.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36')
          driver=webdriver.Chrome(options=options)
          driver.set_page_load_timeout(60)
          try:
              driver.get(referer); time.sleep(6)
              result=driver.execute_async_script('''
                const path=arguments[0], done=arguments[arguments.length-1];
                fetch(path,{credentials:'include',headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json, text/javascript, */*; q=0.01'}})
                  .then(async r=>done({status:r.status,contentType:r.headers.get('content-type'),text:await r.text()}))
                  .catch(e=>done({error:String(e)}));
              ''', endpoint)
              if result.get('error'): raise RuntimeError(result['error'])
              text=result.get('text','')
              if result.get('status') != 200 or not text.lstrip().startswith('{'):
                  raise RuntimeError(f"HOSE browser fetch non-JSON: status={result.get('status')} type={result.get('contentType')} prefix={text[:500]!r}")
              payload=json.loads(text); rows=payload.get('rows') or []
              if not rows: raise RuntimeError(f'HOSE returned no HPG disclosures: {payload}')
              found=[]
              for row in rows:
                  title=' '.join(BeautifulSoup(' '.join(str(x) for x in row.get('cell') or []),'html.parser').stripped_strings)
                  if not re.search(r'BCTC|báo cáo tài chính|bao cao tai chinh',title,re.I): continue
                  article_id=str(row.get('id'))
                  meta_path=f'/Modules/CMS/Web/GetRelatedFiles/{article_id}?_search=false&rows=100&page=1&sidx=id&sord=desc'
                  meta=driver.execute_async_script('''
                    const path=arguments[0], done=arguments[arguments.length-1];
                    fetch(path,{credentials:'include',headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json, text/javascript, */*; q=0.01'}})
                      .then(async r=>done({status:r.status,text:await r.text()})).catch(e=>done({error:String(e)}));
                  ''',meta_path)
                  files=[]
                  if meta.get('status')==200 and str(meta.get('text','')).lstrip().startswith('{'):
                      mp=json.loads(meta['text'])
                      for f in mp.get('rows') or []:
                          fc=f.get('cell') or []; name=str(fc[1] if len(fc)>1 else '')
                          files.append({'id':str(f.get('id')),'name':name,'ext':name.rsplit('.',1)[-1].lower() if '.' in name else ''})
                  found.append({'article_id':article_id,'title':title[:400],'files':files})
              if not found: raise RuntimeError(f'No BCTC found among {len(rows)} HPG disclosures')
              print(json.dumps({'source':'OFFICIAL_HOSE','disclosures':len(rows),'bctc_count':len(found),'extensions':sorted({f['ext'] for x in found for f in x['files'] if f['ext']}),'bctc':found[:20]},ensure_ascii=False,indent=2))
          finally:
              driver.quit()
          PY
