name: Inspect Vietnam raw reference schemas

on:
  push:
    branches: [data-source-smoke-v1]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install client
        run: python -m pip install 'vnstock==4.0.7' 'pandas<3'
      - name: Inspect raw HOSE industry and shares schemas
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from vnstock import Reference

          def pack(df, limit=8):
              return {
                  'shape': list(getattr(df,'shape',(0,0))),
                  'columns': [str(c) for c in getattr(df,'columns',[])],
                  'sample': df.head(limit).to_dict(orient='records') if isinstance(df,pd.DataFrame) else str(df)[:1000],
              }

          ref=Reference()
          exchanges=ref.equity.list_by_exchange()
          industries=ref.equity.list_by_industry()
          companies={}
          for ticker in ('HPG','MBB','SSI','FPT'):
              try:
                  info=ref.company(ticker).info()
                  companies[ticker]=pack(info)
              except Exception as e:
                  companies[ticker]={'error':str(e)}
          print(json.dumps({
              'role':'RAW_INPUT_ONLY_SCHEMA_PROBE',
              'exchanges':pack(exchanges,12),
              'industries':pack(industries,12),
              'companies':companies,
          },ensure_ascii=False,indent=2,default=str))
          PY
