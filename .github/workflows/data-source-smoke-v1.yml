name: Smoke official SSC disclosure portal

on:
  push:
    branches: [data-source-smoke-v1]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser client
        run: |
          google-chrome --version
          python -m pip install selenium
      - name: Inspect public SSC disclosure search DOM
        run: |
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          opts=Options()
          opts.page_load_strategy='eager'
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1600,1200','--lang=vi-VN'):
              opts.add_argument(arg)
          d=webdriver.Chrome(options=opts); d.set_page_load_timeout(45)
          try:
              d.get('https://congbothongtin.ssc.gov.vn/')
              WebDriverWait(d,40).until(lambda x: 'Báo cáo công bố' in x.page_source or 'Báo cáo tài chính' in x.page_source)
              time.sleep(4)
              inputs=[]
              for el in d.find_elements(By.CSS_SELECTOR,'input,select,button,a'):
                  try:
                      text=(el.text or el.get_attribute('value') or '').strip()
                      attrs={k:el.get_attribute(k) for k in ('id','name','type','title','placeholder','aria-label','href')}
                      if text or any(attrs.values()):
                          inputs.append({'tag':el.tag_name,'text':text[:160],**attrs})
                  except Exception:
                      pass
              body=d.find_element(By.TAG_NAME,'body').text
              print(json.dumps({'title':d.title,'url':d.current_url,'body_prefix':body[:4000],'controls':inputs[:250]},ensure_ascii=False,indent=2))
              if 'Báo cáo tài chính' not in body:
                  raise RuntimeError('SSC public disclosure report filters not visible')
          finally:
              d.quit()
          PY
