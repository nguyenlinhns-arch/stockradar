name: Align ticker lifecycle regressions once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-ticker-lifecycle-regressions-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main
        run: git pull --ff-only origin main
      - name: Patch lifecycle assertions
        run: python scripts/align_ticker_lifecycle_regressions_once.py
      - name: Build reference-stage public data
        run: python -m engine.cli build-public
      - name: Run affected suites at reference stage
        run: python -m unittest engine.tests.test_email_subscription_funnel engine.tests.test_static_assets engine.tests.test_static_radar_ticker_pages
      - name: Fail-close seed and rerun source-sensitive checks
        run: |
          python scripts/fail_close_public_ticker_seed.py website/public/data/ticker-universe.json
          python -m unittest engine.tests.test_email_subscription_funnel engine.tests.test_static_assets engine.tests.test_static_radar_ticker_pages
      - name: Commit lifecycle assertions only
        run: |
          git checkout -- website/public/data
          git config user.name stockradar-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Align ticker universe tests with reference and fail-closed stages'
          git pull --rebase origin main
          git push origin HEAD:main
# retry 3
