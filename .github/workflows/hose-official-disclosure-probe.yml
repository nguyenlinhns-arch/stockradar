name: Probe HOSE official disclosures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke_hose_official_api.py'
      - '.github/workflows/hose-official-disclosure-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Smoke-test HOSE issuer lookup and disclosures
        run: python scripts/smoke_hose_official_api.py
