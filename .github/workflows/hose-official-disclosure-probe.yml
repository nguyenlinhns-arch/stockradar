name: Probe HOSE official disclosures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_hose_official_disclosures.py'
      - '.github/workflows/hose-official-disclosure-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe public HOSE disclosure surfaces
        run: python scripts/probe_hose_official_disclosures.py
