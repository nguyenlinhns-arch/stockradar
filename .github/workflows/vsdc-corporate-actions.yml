name: StockRadar VSDC Corporate Actions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/acquire_vsdc_corporate_actions.py'
      - 'scripts/run_vsdc_corporate_actions_v2.py'
      - 'scripts/build_corporate_action_gate_v2.py'
      - '.github/workflows/vsdc-corporate-actions.yml'
  schedule:
    # 07:45 Asia/Ho_Chi_Minh: refresh event-risk gate before the 09:00 brief.
    - cron: '45 0 * * 1-5'
    # 15:40 Asia/Ho_Chi_Minh: refresh after the post-close market snapshot.
    - cron: '40 8 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: stockradar-vsdc-corporate-actions
  cancel-in-progress: false

jobs:
  corporate-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas requests lxml html5lib

      - name: Reuse latest non-expired HOSE market artifact for canonical universe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/market
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=stockradar-hose-market-bootstrap&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo 'No reusable market artifact found; corporate-action gate remains fail-closed.' >&2
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market.zip
          unzip -q -o /tmp/market.zip -d artifacts/market

      - name: Acquire complete VSDC corporate-action calendar window
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          read -r start end <<EOF
          $(python - "$as_of" <<'PY'
          from datetime import date, timedelta
          import sys
          d = date.fromisoformat(sys.argv[1])
          print((d - timedelta(days=180)).isoformat(), (d + timedelta(days=180)).isoformat())
          PY
          )
          EOF
          python scripts/run_vsdc_corporate_actions_v2.py \
            --start "$start" \
            --end "$end" \
            --output-dir artifacts/vsdc

      - name: Build 405-HOSE corporate-action risk gate
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          python scripts/build_corporate_action_gate_v2.py \
            --universe artifacts/market/security_master.csv \
            --events artifacts/vsdc/vsdc_hose_corporate_actions_current.csv \
            --coverage artifacts/vsdc/vsdc_hose_corporate_actions_coverage.json \
            --as-of "$as_of" \
            --output artifacts/vsdc/corporate_action_gate_v2_405.csv \
            --manifest artifacts/vsdc/corporate_action_gate_v2_manifest.json

      - name: Enforce day coverage, pagination completeness and fail-closed publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path('artifacts/vsdc/vsdc_hose_corporate_actions_coverage.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('artifacts/vsdc/corporate_action_gate_v2_manifest.json').read_text(encoding='utf-8'))
          requested = max(int(coverage.get('days_requested') or 0), 1)
          fetched = int(coverage.get('days_fetched') or 0)
          ratio = float(coverage.get('source_coverage_ratio') or fetched / requested)
          incomplete = int(coverage.get('days_pagination_incomplete') or 0)
          advertised = int(coverage.get('advertised_records_all_markets') or 0)
          raw_rows = int(coverage.get('raw_table_rows_all_markets') or 0)
          pages_expected = int(coverage.get('pagination_pages_expected') or 0)
          pages_fetched = int(coverage.get('pagination_pages_fetched') or 0)

          failures = []
          if ratio < 0.98:
              failures.append(f'day_coverage={fetched}/{requested} ({ratio:.2%})')
          if coverage.get('source_ready') is not True:
              failures.append('coverage_source_ready=false')
          if coverage.get('pagination_complete') is not True or incomplete != 0:
              failures.append(f'pagination_incomplete_days={incomplete}')
          if pages_fetched < pages_expected:
              failures.append(f'pages={pages_fetched}/{pages_expected}')
          if raw_rows < advertised:
              failures.append(f'raw_rows={raw_rows}<advertised={advertised}')
          if manifest.get('canonical_hose') != 405:
              failures.append('canonical_hose_not_405')
          if manifest.get('source_ready') is not True or manifest.get('pagination_complete') is not True:
              failures.append('gate_source_not_ready')
          if manifest.get('publication_allowed') is not False:
              failures.append('raw_publication_must_remain_closed')
          if failures:
              raise SystemExit('VSDC corporate-action QA failed: ' + '; '.join(failures))

          print(json.dumps({
              'coverage_ratio': ratio,
              'pagination_complete': True,
              'advertised_records_all_markets': advertised,
              'raw_table_rows_all_markets': raw_rows,
              'pages_fetched': pages_fetched,
              'event_rows_hose': manifest.get('event_rows'),
              'gate_counts': manifest.get('gate_counts'),
          }, ensure_ascii=False))
          PY

      - name: Upload internal VSDC corporate-action artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-vsdc-corporate-actions-v2
          path: artifacts/vsdc/
          retention-days: 30
          if-no-files-found: error