name: Probe VSDC pagination

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_vsdc_pagination.py'
      - '.github/workflows/vsdc-pagination-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect VSDC page-2 request contract
        run: python scripts/probe_vsdc_pagination.py --date 27/07/2026
