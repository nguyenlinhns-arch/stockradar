name: Patch Research V7 Official Depth

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_research_v7_official_depth_once.py'
      - '.github/workflows/patch-research-v7-official-depth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow V7 official-depth patch
        run: python scripts/patch_research_v7_official_depth_once.py
      - name: Commit patched research workflow
        run: |
          git config user.name stockradar-bot
          git config user.email stockradar-bot@users.noreply.github.com
          git add .github/workflows/research-decision-v7.yml
          if git diff --cached --quiet; then
            echo 'Research V7 workflow already patched.'
          else
            git commit -m 'Integrate deep official HOSE disclosures into Research V7'
            git push
          fi
