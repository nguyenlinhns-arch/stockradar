name: Patch Research V7 Official Depth

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_research_v7_official_depth.py'
      - '.github/workflows/patch-research-v7-official-depth.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render patched V7 workflow to normal repository file
        run: python scripts/render_research_v7_official_depth.py
      - name: Commit rendered workflow copy
        run: |
          set -euo pipefail
          git config user.name stockradar-bot
          git config user.email stockradar-bot@users.noreply.github.com
          git add docs/research-decision-v7-official-depth-rendered.yml
          if git diff --cached --quiet; then
            echo 'Rendered workflow copy already current.'
          else
            git commit -m 'Render Research V7 official-depth integration'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
