name: Acquire internal reference depth V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquire-reference-depth-v2.yml'
      - 'scripts/acquire_reference_depth_v2.py'
      - 'scripts/acquire_vsdc_corporate_actions.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-insider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==3.0.5 requests==2.32.5
      - name: Acquire deeper company news and insider references
        run: python scripts/acquire_reference_depth_v2.py
      - name: Upload news and insider artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-news-insider-depth-v2
          path: artifacts/reference-depth-v2/
          retention-days: 14
          if-no-files-found: error

  vsdc-corporate-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install VSDC acquisition dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==3.0.5 requests==2.32.5 lxml==6.0.1
      - name: Acquire current and near-future VSDC HOSE corporate actions
        run: python scripts/acquire_vsdc_corporate_actions.py --start 2026-05-01 --end 2027-03-01 --workers 10 --output-dir artifacts/vsdc-corporate-actions
      - name: Upload VSDC artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-vsdc-corporate-actions-v2
          path: artifacts/vsdc-corporate-actions/
          retention-days: 14
          if-no-files-found: error
