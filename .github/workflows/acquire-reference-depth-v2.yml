name: Acquire internal reference depth V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquire-reference-depth-v2.yml'
      - 'scripts/acquire_reference_depth_v2.py'
      - 'scripts/acquire_vsdc_corporate_actions.py'
      - 'scripts/run_vsdc_corporate_actions_v2.py'
      - 'scripts/acquire_kbs_events_depth_v3.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-insider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==3.0.5 requests==2.32.5
      - name: Acquire deeper company news and insider references
        run: python scripts/acquire_reference_depth_v2.py
      - name: Upload news and insider artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-news-insider-depth-v2
          path: artifacts/reference-depth-v2/
          retention-days: 14
          if-no-files-found: error

  kbs-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install KBS event dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==3.0.5 requests==2.32.5
      - name: Acquire deep paginated KBS events by event type
        run: python scripts/acquire_kbs_events_depth_v3.py --workers 10 --output-dir artifacts/kbs-events-depth-v3
      - name: Enforce KBS event coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/kbs-events-depth-v3/kbs_company_events_coverage_v3.json')
          c = json.loads(path.read_text(encoding='utf-8'))
          if int(c.get('canonical_hose') or 0) < 405:
              raise SystemExit('KBS event universe below 405')
          if int(c.get('ticker_rows') or 0) < 405:
              raise SystemExit('KBS event ticker rows below 405')
          if c.get('errors'):
              raise SystemExit(f"KBS event acquisition errors: {len(c['errors'])}")
          print(json.dumps(c, ensure_ascii=False))
          PY
      - name: Upload KBS event artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-kbs-events-depth-v3
          path: artifacts/kbs-events-depth-v3/
          retention-days: 14
          if-no-files-found: error

  vsdc-corporate-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install VSDC acquisition dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==3.0.5 requests==2.32.5 lxml==6.0.1
      - name: Acquire current and near-future VSDC HOSE corporate actions
        run: python scripts/run_vsdc_corporate_actions_v2.py --start 2026-05-01 --end 2027-03-01 --workers 10 --output-dir artifacts/vsdc-corporate-actions
      - name: Enforce VSDC quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/vsdc-corporate-actions/vsdc_hose_corporate_actions_coverage.json')
          coverage = json.loads(path.read_text(encoding='utf-8'))
          requested = max(int(coverage.get('days_requested') or 0), 1)
          fetched = int(coverage.get('days_fetched') or 0)
          ratio = fetched / requested
          rows = int(coverage.get('row_count') or 0)
          failed = int(coverage.get('days_failed') or 0)
          print(json.dumps({'coverage_ratio': ratio, 'rows': rows, 'days_failed': failed}, ensure_ascii=False))
          if ratio < 0.98:
              raise SystemExit(f'VSDC coverage too low: {fetched}/{requested} ({ratio:.2%})')
          if rows <= 0:
              raise SystemExit('VSDC returned no HOSE corporate-action rows in a window that includes historical dates')
          PY
      - name: Upload VSDC artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-vsdc-corporate-actions-v2
          path: artifacts/vsdc-corporate-actions/
          retention-days: 14
          if-no-files-found: error
