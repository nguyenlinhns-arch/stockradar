name: Patch auth and checkout source once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-auth-checkout-source-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Patch source files
        run: |
          python - <<'PY'
          from pathlib import Path

          # Always publish the checkout route. The backend remains fail-closed until
          # real bank configuration and billing evidence are enabled.
          path = Path('scripts/apply_buyer_readiness.py')
          text = path.read_text(encoding='utf-8')
          old = '    checkout_ready = enabled("STOCKRADAR_CHECKOUT_READY")\n'
          new = '    checkout_ready = enabled("STOCKRADAR_CHECKOUT_READY") or (output / "thanh-toan" / "index.html").is_file()\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('apply_buyer checkout marker not found')
          path.write_text(text, encoding='utf-8')

          # Preserve Premium intent through email verification and continue directly
          # to checkout instead of forcing users through the account page first.
          path = Path('website/assets/auth.js')
          text = path.read_text(encoding='utf-8')
          old = "  const PENDING_SIGNUP_KEY = 'sr_pending_signup_email';\n  const OTP_RESEND_SECONDS = 60;\n"
          new = "  const PENDING_SIGNUP_KEY = 'sr_pending_signup_email';\n  const PENDING_SIGNUP_PLAN_KEY = 'sr_pending_signup_plan';\n  const PENDING_SIGNUP_NEXT_KEY = 'sr_pending_signup_next';\n  const OTP_RESEND_SECONDS = 60;\n"
          if old in text:
              text = text.replace(old, new, 1)

          marker = "  function clearPendingSignupEmail() {\n    try { sessionStorage.removeItem(PENDING_SIGNUP_KEY); } catch (_) {}\n  }\n"
          addition = marker + "\n  function selectedSignupPlan(form) {\n    return String(form?.elements?.selected_plan?.value || 'free').trim().toLowerCase() === 'premium' ? 'premium' : 'free';\n  }\n\n  function signupDestination(plan) {\n    const params = new URLSearchParams(location.search);\n    const requestedNext = params.get('next');\n    if (requestedNext) return safeNext(requestedNext);\n    const target = new URL(plan === 'premium' ? 'thanh-toan/?plan=premium' : 'tai-khoan/', document.baseURI);\n    const ticker = String(params.get('ticker') || '').trim().toUpperCase();\n    if (/^[A-Z0-9]{3}$/.test(ticker)) target.searchParams.set('ticker', ticker);\n    return target.toString();\n  }\n\n  function setPendingSignupFlow(plan, destination) {\n    try {\n      sessionStorage.setItem(PENDING_SIGNUP_PLAN_KEY, plan === 'premium' ? 'premium' : 'free');\n      sessionStorage.setItem(PENDING_SIGNUP_NEXT_KEY, destination);\n    } catch (_) {}\n  }\n\n  function pendingSignupDestination() {\n    try {\n      const saved = sessionStorage.getItem(PENDING_SIGNUP_NEXT_KEY) || '';\n      if (saved) return safeNext(saved);\n      const plan = sessionStorage.getItem(PENDING_SIGNUP_PLAN_KEY) === 'premium' ? 'premium' : 'free';\n      return signupDestination(plan);\n    } catch (_) {\n      return signupDestination('free');\n    }\n  }\n\n  function clearPendingSignupFlow() {\n    try {\n      sessionStorage.removeItem(PENDING_SIGNUP_PLAN_KEY);\n      sessionStorage.removeItem(PENDING_SIGNUP_NEXT_KEY);\n    } catch (_) {}\n  }\n"
          if marker in text and 'function pendingSignupDestination()' not in text:
              text = text.replace(marker, addition, 1)

          old = "          clearPendingSignupEmail();\n          setMessage(message, 'Xác minh thành công. Đang mở tài khoản…', 'success');\n          location.href = siteUrl('tai-khoan/?verified=1');\n"
          new = "          const destination = pendingSignupDestination();\n          clearPendingSignupEmail();\n          clearPendingSignupFlow();\n          setMessage(message, 'Xác minh thành công. Đang tiếp tục…', 'success');\n          location.href = destination;\n"
          if old in text:
              text = text.replace(old, new, 1)

          old = "            options: { emailRedirectTo: siteUrl('tai-khoan/?verified=1') }\n"
          new = "            options: { emailRedirectTo: pendingSignupDestination() }\n"
          if old in text:
              text = text.replace(old, new, 1)

          old = "      setBusy(form, true, 'Đang tạo tài khoản…');\n      setMessage(message, 'Đang tạo tài khoản và gửi mã xác minh…');\n"
          new = "      const plan = selectedSignupPlan(form);\n      const destination = signupDestination(plan);\n      setPendingSignupFlow(plan, destination);\n\n      setBusy(form, true, 'Đang tạo tài khoản…');\n      setMessage(message, 'Đang tạo tài khoản và gửi mã xác minh…');\n"
          if old in text:
              text = text.replace(old, new, 1)

          old = "          options: { emailRedirectTo: siteUrl('tai-khoan/?verified=1') }\n"
          new = "          options: { emailRedirectTo: destination }\n"
          if old in text:
              text = text.replace(old, new, 1)

          old = "          clearPendingSignupEmail();\n          setMessage(message, 'Tạo tài khoản thành công. Đang mở trang tài khoản…', 'success');\n          location.href = siteUrl('tai-khoan/');\n"
          new = "          clearPendingSignupEmail();\n          clearPendingSignupFlow();\n          setMessage(message, plan === 'premium' ? 'Tạo tài khoản thành công. Đang mở thanh toán Premium…' : 'Tạo tài khoản thành công. Đang mở trang tài khoản…', 'success');\n          location.href = destination;\n"
          if old in text:
              text = text.replace(old, new, 1)

          old = "        clearPendingSignupEmail();\n        setMessage(message, 'Đăng nhập thành công.', 'success');\n"
          new = "        clearPendingSignupEmail();\n        clearPendingSignupFlow();\n        setMessage(message, 'Đăng nhập thành công.', 'success');\n"
          if old in text:
              text = text.replace(old, new, 1)

          for required in ('PENDING_SIGNUP_PLAN_KEY', 'pendingSignupDestination()', 'location.href = destination;'):
              if required not in text:
                  raise SystemExit(f'auth flow marker missing after patch: {required}')
          path.write_text(text, encoding='utf-8')

          # When a CTA already chose Free or Premium, hide the redundant plan picker.
          path = Path('website/assets/signup-email-intent.js')
          text = path.read_text(encoding='utf-8')
          marker = "    if (requested && VALID_PLANS.has(requested.toLowerCase())) {\n      const radio = form.querySelector(`input[name=\"selected_plan\"][value=\"${requested.toLowerCase()}\"]`);\n      if (radio) radio.checked = true;\n    }\n"
          replacement = marker + "    const lockedPlan = requested && VALID_PLANS.has(requested.toLowerCase()) ? requested.toLowerCase() : '';\n    const selector = form.querySelector('.signup-plan-selector');\n    if (selector && lockedPlan) {\n      selector.hidden = true;\n      selector.dataset.planLocked = lockedPlan;\n      if (!form.querySelector('[data-signup-locked-plan]')) {\n        const summary = document.createElement('div');\n        summary.className = 'signup-plan-note signup-locked-plan';\n        summary.dataset.signupLockedPlan = lockedPlan;\n        summary.textContent = lockedPlan === 'premium'\n          ? 'Đang đăng ký Premium · 199.000đ/30 ngày. Xác minh tài khoản xong sẽ chuyển sang bước thanh toán.'\n          : 'Đang đăng ký Free · 0đ. Xác minh tài khoản xong sẽ mở trang tài khoản.';\n        selector.before(summary);\n      }\n    }\n"
          if marker in text and 'data.signupLockedPlan' not in text:
              text = text.replace(marker, replacement, 1)
          if 'selector.dataset.planLocked' not in text:
              raise SystemExit('signup locked-plan patch missing')
          path.write_text(text, encoding='utf-8')

          # Auth regression should validate transactional Supabase readiness, not the
          # unrelated Premium product-email launch flag in the Pages workflow.
          path = Path('engine/tests/test_auth_surfaces.py')
          text = path.read_text(encoding='utf-8')
          old = "        self.assertIn('STOCKRADAR_AUTH_EMAIL_READY: \"1\"', workflow)\n        self.assertIn('STOCKRADAR_PRODUCT_EMAIL_READY: \"0\"', workflow)\n"
          new = "        self.assertIn(\"transactionalAuthReady\", gate)\n        self.assertIn(\"config.configured === true\", gate)\n        self.assertIn('STOCKRADAR_PRODUCT_EMAIL_READY: \"0\"', workflow)\n"
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression
        run: |
          python -m unittest -v \
            engine.tests.test_auth_surfaces \
            engine.tests.test_checkout_surface \
            engine.tests.test_manual_checkout_runtime \
            engine.tests.test_conversion_v3

      - name: Commit source patch
        run: |
          set -euo pipefail
          git config user.name "stockradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/apply_buyer_readiness.py website/assets/auth.js website/assets/signup-email-intent.js engine/tests/test_auth_surfaces.py
          git commit -m "Complete signup continuation and checkout publication"
          git pull --rebase origin main
          git push origin HEAD:main
