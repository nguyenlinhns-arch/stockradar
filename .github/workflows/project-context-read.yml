name: Verify owned project reads and knowledge provider status
on:
  push:
    branches: ['fix/project-context-read-20260907']
    paths:
      - 'supabase/functions/_shared/chat-continuation.ts'
      - 'scripts/project_context_read_test.mjs'
      - 'scripts/apply_project_context_read.py'
      - '.github/workflows/project-context-read.yml'
permissions:
  contents: write
concurrency:
  group: project-context-read-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pandas==3.0.5 requests==2.34.2 pytest==9.1.1
      - name: Apply source-anchored backend changes
        run: python scripts/apply_project_context_read.py
      - name: Verify all current suites and private record behavior
        run: |
          node --test scripts/project_context_read_test.mjs scripts/private_project_bridge_test.mjs scripts/project_knowledge_bridge_test.mjs
          node --test engine/tests/*.test.mjs
          python -m unittest discover -s engine/tests
          python -m pytest engine/tests -q
          git diff --check
      - name: Commit verified backend source without rebuilding unchanged frontend
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'StockRadar continuation verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/stock-ai-chat/index.ts engine/tests/private_project_chat.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Read owned project records independently of inference and classify provider failures [skip ci]'
            git push origin "HEAD:$BRANCH_NAME"
          fi
          echo "Verified backend source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
