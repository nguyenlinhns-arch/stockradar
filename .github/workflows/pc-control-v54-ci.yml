name: PC Control V5.4 Windows CI

on:
  push:
    branches:
      - pc-control
    paths:
      - 'pc-control/v5_4/**'
      - '.github/workflows/pc-control-v54-ci.yml'
  workflow_dispatch:

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python agent
        shell: pwsh
        run: python -m py_compile pc-control/v5_4/agent.py

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'pc-control/v5_4/install.ps1',
            'pc-control/v5_4/uninstall.ps1',
            'pc-control/v5_4/repair_hub.ps1',
            'pc-control/v5_4/start_desktop_commander.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PowerShell parse OK: $file"
          }

      - name: Validate config and agent allow-list
        shell: pwsh
        run: |
          python -c "import json; c=json.load(open(r'pc-control/v5_4/config.json', encoding='utf-8')); assert c['hub_url']=='http://127.0.0.1:4310/'; assert c['poll_seconds']==180; assert 'start_desktop_commander.ps1' in c['desktop_commander_command']; assert '@latest' not in c['desktop_commander_command']; print('config JSON, 180s poll, Hub root, and local-first RDC command OK')"
          python -c "import importlib.util; p=r'pc-control/v5_4/agent.py'; s=importlib.util.spec_from_file_location('pcbridge',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.parse_action('[PC-CONTROL] PING')=='PING'; assert m.parse_action('[ZALO-CONTROL] RESTART_DESKTOP_COMMANDER')=='RESTART_DESKTOP_COMMANDER'; assert m.parse_action('[OTHER] PING') is None; r=m.run_action('PING'); assert r.get('ok') and r.get('pong'); r=m.run_action('SHELL'); assert not r.get('ok'); print('allow-list tests OK')"

      - name: Verify release manifest hashes
        shell: pwsh
        run: |
          $release = Get-Content 'pc-control/v5_4/RELEASE.json' -Raw | ConvertFrom-Json
          $checks = @{
            agent_git_blob_sha1 = 'pc-control/v5_4/agent.py'
            config_git_blob_sha1 = 'pc-control/v5_4/config.json'
            installer_git_blob_sha1 = 'pc-control/v5_4/install.ps1'
            repair_hub_git_blob_sha1 = 'pc-control/v5_4/repair_hub.ps1'
            automation_hub_wrapper_git_blob_sha1 = 'pc-control/v5_4/automation_hub.cmd'
            desktop_commander_launcher_git_blob_sha1 = 'pc-control/v5_4/start_desktop_commander.ps1'
          }
          foreach ($key in $checks.Keys) {
            $actual = (git hash-object $checks[$key]).Trim()
            $expected = $release.$key
            if ($actual -ne $expected) { throw "$key mismatch: expected=$expected actual=$actual" }
            Write-Host "$key OK: $actual"
          }
          if ($release.github_rescue_mode -ne 'public-read-local-result') { throw 'Release rescue mode is not private-result' }
          if ($release.github_poll_seconds -ne 180) { throw 'Release polling is not 180 seconds' }

      - name: Exercise installer without starting services
        shell: pwsh
        run: |
          & ./pc-control/v5_4/install.ps1 -NoStart
          if ($LASTEXITCODE -ne 0) { throw "Installer returned $LASTEXITCODE" }
          $root = Join-Path $env:LOCALAPPDATA 'ThayLinhPCBridge'
          $required = @(
            (Join-Path $root 'agent.py'),
            (Join-Path $root 'config.json'),
            (Join-Path $root 'repair_hub.ps1'),
            (Join-Path $root 'start_desktop_commander.ps1'),
            (Join-Path $root 'automation_hub.cmd'),
            (Join-Path $root 'run_bridge.ps1'),
            (Join-Path $root 'REPAIR_NOW.cmd'),
            (Join-Path $root 'gh.cmd'),
            (Join-Path $env:USERPROFILE '.openai\computer-use\automation_hub.cmd')
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing installed file: $file" }
            Write-Host "Installed OK: $file"
          }
          $installedConfig = Get-Content (Join-Path $root 'config.json') -Raw | ConvertFrom-Json
          if ($installedConfig.hub_url -ne 'http://127.0.0.1:4310/') { throw 'Installed Hub URL mismatch' }
          if ($installedConfig.poll_seconds -ne 180) { throw 'Installed polling interval mismatch' }
          if ($installedConfig.desktop_commander_command -match '@latest') { throw 'Installed config still uses @latest' }
          $runner = Get-Content (Join-Path $root 'run_bridge.ps1') -Raw
          if ($runner -notmatch 'THAYLINH_GITHUB_TOKEN') { throw 'Runner does not clear GitHub token variables' }
          if ($runner -notmatch '\$env:PATH = "\$Root;\$env:PATH"') { throw 'Runner does not prepend local gh shim' }
          $shim = Get-Content (Join-Path $root 'gh.cmd') -Raw
          if ($shim -notmatch 'exit /b 1') { throw 'GitHub CLI shim is not fail-closed' }
          Write-Host 'Private-result rescue environment OK.'

      - name: Exercise uninstall rollback
        if: always()
        shell: pwsh
        run: |
          & ./pc-control/v5_4/uninstall.ps1
          $root = Join-Path $env:LOCALAPPDATA 'ThayLinhPCBridge'
          if (Test-Path -LiteralPath $root) { throw "Uninstall left root behind: $root" }
          Write-Host 'Rollback cleanup OK.'
