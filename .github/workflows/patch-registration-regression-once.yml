name: Patch registration regression once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-registration-regression-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh current main
        run: git pull --ff-only origin main

      - name: Patch regression
        run: python scripts/patch_registration_regression_once.py

      - name: Remove one-shot helpers
        run: |
          rm .github/workflows/patch-registration-regression-once.yml
          rm scripts/patch_registration_regression_once.py

      - name: Commit patch
        run: |
          git config user.name "stockradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align registration regression with current product policy"
          git pull --rebase origin main
          git push origin HEAD:main
