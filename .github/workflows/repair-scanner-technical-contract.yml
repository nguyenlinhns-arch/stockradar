name: Repair scanner technical contract

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/repair_scanner_technical_contract_once.py'
      - '.github/workflows/repair-scanner-technical-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch producer contract
        run: python scripts/repair_scanner_technical_contract_once.py
      - name: Commit repaired producer
        run: |
          git config user.name stockradar-bot
          git config user.email stockradar-bot@users.noreply.github.com
          git add scripts/bootstrap_kbs_hose_data.py
          git commit -m 'Fix technical feature contract for full-HOSE scanner'
          git push
