name: Repair scanner source-time fallback

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/repair_scanner_source_time_once.py'
      - '.github/workflows/repair-scanner-technical-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner source-time fallback
        run: python scripts/repair_scanner_source_time_once.py
      - name: Commit repaired scanner
        run: |
          git config user.name stockradar-bot
          git config user.email stockradar-bot@users.noreply.github.com
          git add scripts/build_internal_scanner_feed_v2.py
          if git diff --cached --quiet; then
            echo 'Scanner fallback already repaired; nothing to commit.'
          else
            git commit -m 'Fix scanner fallback when source_time_ms is absent'
            git push
          fi
