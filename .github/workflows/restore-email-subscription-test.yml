name: Restore email subscription regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-email-subscription-test.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore full regression coverage
        run: python scripts/restore_email_subscription_regression.py

      - name: Commit restoration
        run: |
          set -euo pipefail
          git config user.name "stockradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore full email regression coverage"
          git pull --rebase origin main
          git push origin HEAD:main
