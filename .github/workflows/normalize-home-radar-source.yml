name: Normalize operational Radar source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-home-radar-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Remove fixed Radar recommendations from homepage source
        run: python scripts/upgrade_home_radar_operational.py website
      - name: Commit normalized source if changed
        run: |
          if git diff --quiet -- website/index.html; then
            echo 'Homepage already normalized.'
            exit 0
          fi
          git config user.name 'stockradar-automation'
          git config user.email 'stockradar-automation@users.noreply.github.com'
          git add website/index.html
          git commit -m 'Normalize homepage Radar to dynamic full-HOSE feed'
          git push origin HEAD:main
