name: Validate compact Radar methodology

on:
  push:
    branches: [radar-methodology-compact]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build public data
        run: python -m engine.cli build-public
      - name: Run regression suite
        run: python -m unittest discover -s engine/tests -v
      - name: Verify compact Radar copy
        run: |
          grep -q '4 phương pháp cốt lõi' website/radar5/index.html
          grep -q '4M &amp; Payback — Phil Town' website/radar5/index.html
          grep -q 'CANSLIM — William J. O’Neil' website/radar5/index.html
          grep -q 'SEPA / VCP — Mark Minervini' website/radar5/index.html
          grep -q 'VPA / Wyckoff — Anna Coulling &amp; Richard D. Wyckoff' website/radar5/index.html
          ! grep -q 'Không dùng một chỉ báo đơn lẻ' website/radar5/index.html
          ! grep -q 'Có áp dụng được tại thị trường Việt Nam?' website/radar5/index.html
