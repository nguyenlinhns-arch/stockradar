name: Validate SSI raw adapter V1

on:
  push:
    branches: [ssi-raw-adapter-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build public fail-closed payloads
        run: python -m engine.cli build-public
      - name: Run full regression suite
        run: python -m unittest discover -s engine/tests -v
      - name: Syntax-check SSI adapter and acquisition CLI
        run: python -m py_compile engine/stockradar/ssi_raw_adapter.py scripts/acquire_ssi_raw_market.py
      - name: Verify SSI credentials stay environment-only
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('engine/stockradar/ssi_raw_adapter.py'), Path('scripts/acquire_ssi_raw_market.py')]
          source = '\n'.join(path.read_text(encoding='utf-8') for path in files)
          required = ['SSI_FASTCONNECT_CLIENT_ID', 'SSI_FASTCONNECT_API_KEY', 'SSI_FASTCONNECT_API_SECRET']
          for name in required:
              assert name in source, name
          forbidden = ['sb_secret_', 'service_role', 'BEGIN PRIVATE KEY', 'BEGIN RSA PRIVATE KEY']
          for marker in forbidden:
              assert marker not in source, marker
          print('SSI credential source policy: PASS')
          PY
      - name: Build and verify Pages
        env:
          STOCKRADAR_ENABLE_AUTH: "1"
          STOCKRADAR_AUTH_EMAIL_READY: "0"
          STOCKRADAR_PRODUCT_EMAIL_READY: "0"
          STOCKRADAR_CHECKOUT_READY: "0"
          STOCKRADAR_SUPABASE_URL: "https://xamviatbxufjlpiwhebb.supabase.co"
          STOCKRADAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Ne0TfBw0Iu732yrhqRcdIA_hPGxYDAK"
        run: |
          python scripts/build_pages.py --output .pages-site
          python scripts/inject_public_ux.py .pages-site
          python scripts/apply_buyer_readiness.py .pages-site
          python scripts/verify_pages_auth.py .pages-site
          python scripts/verify_pages_public_surface.py .pages-site
          python scripts/verify_buyer_readiness.py .pages-site
