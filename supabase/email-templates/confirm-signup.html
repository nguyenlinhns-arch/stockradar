<!doctype html>
<html lang="vi">
  <body style="margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px">
      <div style="background:#ffffff;border:1px solid #dde3ed;border-radius:16px;padding:28px">
        <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:#667085">STOCKRADAR.VN</p>
        <h1 style="margin:0 0 14px;font-size:24px">Xác minh tài khoản StockRadar</h1>
        <p style="margin:0 0 18px;line-height:1.6;color:#596579">Nhập mã OTP 6 số dưới đây tại trang đăng ký. Mã này chỉ dùng để xác minh tài khoản StockRadar.</p>
        <div style="margin:20px 0;padding:18px;text-align:center;background:#f2f5fb;border-radius:12px;font-size:32px;font-weight:800;letter-spacing:10px">{{ .Token }}</div>
        <p style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#697386">Không cung cấp mã này cho người khác. StockRadar không bao giờ yêu cầu OTP tài khoản chứng khoán hoặc OTP ngân hàng.</p>
      </div>
    </div>
  </body>
</html>
